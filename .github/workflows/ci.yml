name: CI

on:
  push:
    branches: [main, implementation]
  pull_request:

# Cancel a superseded in-progress run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job below runs a `just` recipe and NOTHING ELSE, so what CI checks and what a contributor
# runs locally cannot drift: `just ci` is these three jobs, in order.
#
# The toolchain is NOT selected here. `rust-toolchain.toml` pins it, and rustup honours that file
# automatically, so the version lives in exactly one place — this workflow cannot install a
# different compiler from the one a contributor gets.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/implementation' }}
      - name: Test
        run: just test-all

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/implementation' }}
      - name: Clippy
        run: just lint

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Rustfmt
        run: just fmt-check
