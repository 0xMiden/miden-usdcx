[workspace]
resolver = "2"
members = [
  "crates/xusdc-encoding",
  "crates/xreserve-deposit-relayer",
  "crates/xreserve-deposit-relayer-lite",
  "crates/withdrawal-listener-attester",
]
# PARKED: `crates/xusdc-validation` sits outside the workspace. The three members above resolve
# the protocol family from the published crates.io `=0.16.0-rc.4` release, but the validation
# crate needs `miden-client`/`miden-client-sqlite-store`, whose newest releases
# (`=0.16.0-alpha.1`) pin protocol `=0.16.0-alpha.4` — no client reaches rc.4, so the crate
# cannot build alongside the rest.
# It un-parks at the migration onto a released `v0.16.0` crates + client/node pair.
exclude = [
  "crates/xusdc-validation",
]

[workspace.dependencies]
# Build-time MASM assembly, consumed by `crates/xusdc-encoding/build.rs`. `miden-protocol-build-utils`
# is the protocol's own build-script toolkit — the project/workspace assembly and the MASM
# error-constant extractor — so the build script carries no copy of either. The assembler family is
# EXACTLY 0.29.1, the version the pinned protocol release resolves: a drift would put two copies of
# the assembler in the graph, at which point the MAST digests stop unifying.
miden-assembly              = "=0.29.1"
miden-core-lib              = "=0.29.1"
miden-package-registry      = "=0.29.1"
miden-protocol-build-utils  = "=0.16.0-rc.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1" }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-forest = { version = "0.3", features = ["chrono"] }
rstest = "0.26"
assert_matches = "1.5"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
bon = "3"
sha3 = "0.10"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query"] }
tower = { version = "0.5", features = ["util"] }
