[workspace]
resolver = "2"
members = [
  "crates/xusdc-encoding",
  "crates/xreserve-deposit-relayer",
  "crates/withdrawal-listener-attester",
]
# The validation crate is excluded: its client dependencies require an older protocol release.
exclude = [
  "crates/xusdc-validation",
]

[workspace.dependencies]
miden-assembly              = "=0.29.1"
miden-core-lib              = "=0.29.1"
miden-package-registry      = "=0.29.1"
miden-protocol-build-utils  = "=0.16.0-rc.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
anyhow = "1"
rstest = "0.26"
assert_matches = "1.5"

hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
bon = "3"
sha3 = "0.10"
rand = "0.8"

reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query"] }
tower = { version = "0.5", features = ["util"] }
