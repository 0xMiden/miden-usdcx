[workspace]
resolver = "2"
members = ["crates/xusdc-encoding", "crates/xusdc-validation", "crates/xreserve-deposit-relayer"]

# Shared dependency versions defined once (workspace-shared-dependencies). Every member consumes
# these with `dep = { workspace = true, features = [...] }`, adding crate-specific feature sets on
# top. Base features are kept minimal here so a crate never inherits a feature it does not use;
# `serde`'s `derive` is the one exception (every consumer needs it).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
anyhow = "1"
rstest = "0.26"
assert_matches = "1.5"

# Hex + attestation crypto. `hex` decodes the Circle-facing wire strings (payload / messageHash /
# attestation) in the relayer. The secp256k1/keccak trio is shared by TWO members now — unit-04's
# vector generator + its D5d in-test vectors, and the relayer's envelope binding (`sha3`, the
# off-chain `keccak256(payload)` recomputation) and its partner-key test fixture (`k256`+`rand`,
# signing ONLY — the relayer NEVER verifies ECDSA off-chain; that is on-chain, faucet-owned). Per
# xusdc-encoding's own note, a second adopter promotes them here so the two crates cannot drift
# onto different versions (workspace-shared-dependencies).
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
rand = "0.8"

# The Miden client. TWO members name it now — `xusdc-validation`'s real-local-node harness, and the
# relayer, whose production advice-map sink IS `TransactionRequestBuilder` — so the version and the
# BASE feature policy live here rather than in either crate (workspace-shared-dependencies). A drift
# between the client the harness validates against and the client the relayer builds transactions
# with is exactly the kind of seam that stays invisible until a real node rejects a real mint.
#
# `=0.15.3` is the release whose protocol family matches the pinned `681fc905…` protocol rev
# (V15-DEVNET-BASELINE); it is an EXACT pin because the note wire form is version-bound to it.
# `default-features = false` + `std` is the minimum that carries the transaction-request types; a
# member adds only what it additionally needs (validation adds `tonic` for the RPC transport, which
# the relayer's note-construction half has no use for).
miden-client = { version = "=0.15.3", default-features = false, features = ["std"] }

# Circle-facing HTTP (the relayer's `circle::client`, CMP-D1/D3/D4) + the offline mock Circle server
# its contract tests run against. Both are pinned here, not in the crate, so the later off-chain
# services (listener, monitoring) cannot drift onto a different HTTP stack.
#
# reqwest 0.13 renamed features vs 0.12: the TLS feature is `rustls` (NOT `rustls-tls`), and
# `RequestBuilder::query` — how every Circle query param (`txHash`, `pageSize`, `pageAfter`, …) is
# built and percent-encoded — now sits behind its own `query` feature. `default-features = false`
# keeps the graph off system OpenSSL and off the default TLS backend; `json` pulls the serde_json
# body codec. This discharges the reqwest deferral recorded in
# crates/xreserve-deposit-relayer/DEFERRED-DEPENDENCIES.md (the Circle-facing slice is the one that
# declares it; the pinned cargo cache now carries reqwest + its hyper/rustls/h2 closure, so the
# offline `--locked` gate still resolves).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
# The relayer's idempotency seam (`idempotency::IdempotencyStore`) — the submitted-nonce log + the
# per-remote-domain `Link` cursor that must survive a restart. SQLite is the persistence choice
# (rationale + the alternatives weighed: crates/xreserve-deposit-relayer/PERSISTENCE-CHOICE.md); it
# is pinned here, not in the crate, because the withdrawal listener needs the same durable-cursor
# store and the two must not drift onto different engines.
#
# `bundled` compiles SQLite from the amalgamation that ships inside `libsqlite3-sys` — the same
# feature `miden-client-sqlite-store` (already in this workspace's graph, on the same rusqlite 0.37)
# uses. It is not a preference: this box has `libsqlite3.so.0` but no `libsqlite3.so` link target, so
# a system-linked build would not link at all, and a bundled build additionally cannot drift with the
# host's SQLite version. `array`/`vtab` are deliberately NOT enabled — the store needs neither.
rusqlite = { version = "0.37", features = ["bundled"] }
# Test-only: the on-disk stores every idempotency test opens, in a directory that is removed when the
# test ends. The restart tests need a REAL file (a store that cannot lose the cursor is the point),
# so an in-memory database is not an option — not even in tests.
tempfile = "3"

# axum ROUTES the schema-exact mock Circle server in the relayer's contract tests, and tower's
# `ServiceExt::oneshot` drives that router IN PROCESS: the mock is an `HttpTransport`, not a socket
# server. That is not a preference — the audit/CI sandbox denies `bind(127.0.0.1:0)` with EPERM, so a
# loopback-server mock cannot be part of a gate that has to be green in every environment. Both are
# DEV-dependencies: no relayer binary ever serves HTTP. wiremock/httpmock/mockito are NOT in the
# pinned cache (they would break the offline gate) — and being socket servers, they could not run in
# the sandbox either.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query"] }
tower = { version = "0.5", features = ["util"] }

# LNV-1 toolchain resolution (ledger: crates/xusdc-validation/VALIDATION-RECORD.md §2).
#
# The validation harness consumes `miden-client 0.15.3` from crates.io, whose protocol-family
# requirements (`miden-protocol`/`miden-standards`/`miden-tx`/`miden-tx-batch-prover`/
# `miden-agglayer` `^0.15.3`) would otherwise resolve to the crates.io releases — a SECOND copy of
# the protocol crates next to the repo's git-rev pins, with non-unifiable types at every API
# boundary. The git rev below IS the v0.15.3 release-tag commit (V15-DEVNET-BASELINE), so these
# entries redirect every registry requirement onto the one pinned source: exactly one copy of each
# protocol crate exists in the graph and types unify across `xusdc-encoding`, `miden-client`, and
# the harness.
[patch.crates-io]
miden-protocol = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8" }
miden-standards = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8" }
miden-tx = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8" }
miden-tx-batch-prover = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8" }
miden-agglayer = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8" }
