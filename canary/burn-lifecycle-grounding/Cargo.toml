[package]
name = "xusdc-canary-burn-lifecycle"
version = "0.0.0"
edition = "2021"
publish = false
description = "Burn-mechanics grounding canary (P5-01): proves the stock fungible-faucet BURN primitives EXECUTE under MockChain on the pinned Miden v0.15.3 / assembler 0.23.3 stack — a user-created asset-bearing BurnNote consumed by the faucet via stock receive_and_burn (allow-all placeholder policy), the token_supply decrement, the 2-block lifecycle (next-block retrieval + same-block erasure), and NoteType::Public discoverability. PLACEHOLDER grounding; isolated from the xusdc-miden faucet build, no real burn policy/schema."

# Isolated workspace. This empty [workspace] table makes the crate its own workspace root, so it
# is fully decoupled from the parent xusdc-miden workspace (members = ["crates/xusdc-encoding"]).
# The parent Cargo.toml is NOT touched.
[workspace]

[lib]
path = "src/lib.rs"

# Path-deps point at the pinned protocol clone (a sibling of xusdc-miden under Miden-Coding).
# Cargo.lock is seeded from that clone's lockfile so the Miden stack resolves to the v0.15.3-locked
# 0.23.3 assembler family (BUILDER-GATES G-MASM). The path is environment-specific; the clone must
# sit at ../../../protocol-pin-v0.15.3 relative to this manifest.
[dependencies]
miden-protocol  = { path = "../../../protocol-pin-v0.15.3/crates/miden-protocol" }
miden-standards = { path = "../../../protocol-pin-v0.15.3/crates/miden-standards" }

[dev-dependencies]
miden-protocol  = { path = "../../../protocol-pin-v0.15.3/crates/miden-protocol", features = ["testing"] }
miden-standards = { path = "../../../protocol-pin-v0.15.3/crates/miden-standards", features = ["testing"] }
miden-testing   = { path = "../../../protocol-pin-v0.15.3/crates/miden-testing" }
# miden-tx (testing feature) provides LocalTransactionProver::prove_dummy, used to turn the user
# send-tx (tx0) and the faucet unauthenticated-consume tx (tx1) into ProvenTransactions for the
# same-block erasure batch. `kernel_tests` (which carries the create_*_proven_tx helpers) is a
# private module in miden-testing, so the canary inlines the equivalent execute + prove_dummy.
miden-tx        = { path = "../../../protocol-pin-v0.15.3/crates/miden-tx", features = ["testing"] }
tokio  = { version = "1", features = ["macros", "rt"] }
anyhow = "1"
