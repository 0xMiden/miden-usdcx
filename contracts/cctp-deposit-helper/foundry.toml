[profile.default]
src = "contracts"
test = "tests"
script = "scripts"
libs = ["modules"]
out = "artifacts"
solc = "tooling/solc-0829"
auto_detect_solc = false
auto_detect_remappings = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = [{ access = "read", path = "./reference/cctp/artifacts" }, { access = "read", path = "./reference/xreserve/artifacts" }]
[profile.default.fuzz]
runs = 1000
seed = "0x2843"
[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = true
[profile.ci.fuzz]
runs = 10000
seed = "0x2843"
[fmt]
line_length = 120
bracket_spacing = true
