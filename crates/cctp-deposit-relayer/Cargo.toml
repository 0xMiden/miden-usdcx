[package]
name = "cctp-deposit-relayer"
version = "0.0.0"
edition = "2021"
publish = false
description = "Independent durable native USDC CCTP to Arc helper worker"

[dependencies]
anyhow = { workspace = true }
httpdate = "1"
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-primitives = { workspace = true, features = ["serde", "k256"] }
alloy-sol-types = { workspace = true, features = ["json"] }
bs58 = "=0.5.1"
borsh = { version = "=1.6.0", features = ["derive"] }
solana-pubkey = { version = "=3.0.0", features = ["curve25519", "sha2"] }
sha2 = "0.10"
clap = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "signal"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }
usdcx-kms-signer = { path = "../usdcx-kms-signer" }
usdcx-telemetry = { path = "../usdcx-telemetry" }

[dev-dependencies]
rusqlite = { workspace = true, features = ["functions"] }
axum = { workspace = true, features = ["tokio"] }
k256 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "process"] }
