[package]
name = "usdcx-bridge"
version = "0.0.0"
edition = "2021"
publish = false
description = "Runs the USDCx deposit relayer and withdrawal attester together"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
humantime = "2"
miden-protocol = { workspace = true }
miden-usdcx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
usdcx-telemetry = { path = "../usdcx-telemetry" }
xreserve-deposit-relayer = { path = "../xreserve-deposit-relayer" }
xusdc-attester = { path = "../xusdc-light-attester" }

[dev-dependencies]
tempfile = { workspace = true }
