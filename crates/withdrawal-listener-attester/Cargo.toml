[package]
name = "withdrawal-listener-attester"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase-4 P4-WITHDRAWAL (CMP-C2/C3): off-chain burn-listener / attester — this slice ships the crate scaffold, the Circle withdrawal wire types, the schema-frozen mock fixtures, and the auth posture"

# The burn-note payload layout and the AccountId↔bytes32 codec are OWNED by the shared encoding crate
# (`xusdc-encoding`, `xreserve::encoding`) and consumed here BY REFERENCE (single-owner rule). In
# particular `types::BurnPayload` IS the shared encoding crate's `XReserveBurnItems` — an alias, not a second copy —
# so the two cannot drift. This crate re-derives no offset and re-implements no codec.
#
# This service RELEASES REAL USDC: it observes a Miden burn, has it signed, and hands Circle the
# evidence that unlocks native USDC on the source chain. Precision on the Circle wire shapes is
# load-bearing, which is why the fixtures are frozen against the OpenAPI and not against these types
# (tests/fixtures/README.md).

[dependencies]
xusdc-encoding = { path = "../xusdc-encoding" }
# Shared versions live in the root [workspace.dependencies]; crate-specific feature sets are added on
# top (workspace-shared-dependencies).
#   serde/serde_json — the Circle wire codecs  and the operator's config file.
#   tokio            — the service runtime the async Circle transport seam runs on.
#   reqwest          — the Circle HTTP transport type the `HttpTransport` seam is defined over. This
#                      slice builds NO driver and makes NO call (that arrives with the Circle drivers); it fixes the seam the
#                      drivers plug into, mirroring the relayer's.
#   hex              — renders the burn-evidence 32-byte fields (note id, nullifier) into the 0x-hex
#                      the Circle wire carries in the burn-evidence package.
#   bon              — `PrepareBurnIntentInput` has eleven fields, five of them optional, and a
#                      positional constructor for it would be a line of eleven arguments where
#                      swapping `remoteDepositor` and `finalDestinationRecipient` still compiles.
#                      The builder makes each field named and each required one compile-time-checked
#                      (use-bon-builder).
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { workspace = true }
hex = { workspace = true }
bon = { workspace = true }
# k256 is a LIBRARY dependency here, and the difference from the relayer is deliberate. The relayer
# keeps k256 DEV-only because it never verifies a signature off-chain — the attestation is verified
# ON-CHAIN by the faucet. This service is the mirror image: the burn attester's off-chain secp256k1
# ECDSA signature over Circle's `messageHashToSign` IS the product (burn signing happens off-chain
# over Circle's opaque digest; Circle's own verification is on the source chain), so the signing core
# is library code. The posture is declared and guarded here, so the signing call site cannot
# arrive with k256 quietly demoted to a dev dependency.
k256 = { workspace = true }
# sha3 (keccak256) is a LIBRARY dependency for the ONE fund-safety step that needs it: recovering the
# 20-byte Ethereum signer address from a burn signature (`keccak256(uncompressed pubkey)[12..]`) so
# `attester::assemble_quorum` can enforce the source-chain `ECDSA.recover`-then-authorize check — a
# signature paired with the wrong signer is refused off-chain, not at Circle's fund-release boundary.
# It is NOT used to derive the signing digest: `attester::sign` still consumes Circle's
# `messageHashToSign` opaquely (no hashing on the input path).
sha3 = { workspace = true }
# The per-burn idempotency ledger's persistence (`idempotency::SubmitLedger`): a single-file SQLite
# database holding the submitted-burn log. This mirrors the relayer's `idempotency` seam; the two must
# not drift onto different engines, which is why the version/features come from the root
# [workspace.dependencies] rather than being re-pinned here.
#
# The reason is the same one, and it is sharper on this side: the dedup is a CLAIM — check-then-insert
# must be ONE atomic step even with two observers (two discovery passes, two processes during a deploy
# overlap) — and SQLite's `BEGIN IMMEDIATE` + a PRIMARY KEY on the burn give exactly that, where a
# JSON file's read-modify-write cannot. Where the relayer's store is a LIVENESS backstop (the faucet's
# `usedNonces` assert is the real safety), this ledger has no on-chain backstop behind it: Circle's
# `409` is the only other guard, and the whole point of the idempotency ledger is that a `409` must never be answered by
# re-sending. The claim IS the safety property here.
#
# `bundled` compiles SQLite from the amalgamation inside `libsqlite3-sys`: this box has
# `libsqlite3.so.0` but no `libsqlite3.so` link target, so a system-linked build would not link, and a
# bundled build cannot drift with the host's SQLite version.
rusqlite = { workspace = true }
# `AccountId` (the faucet id in config, and the `metadata.sender → remoteDepositor` encoding's input)
# and `AssetAmount` (the burn payload's amount) are NAMED in this crate's public API, at the same
# frozen protocol-monorepo git rev the rest of the workspace resolves the protocol family at
# (the workspace-wide protocol pin).
#
# `miden-client` is deliberately ABSENT: no client release exists for the protocol-`next` graph, so
# every real Miden read (the SyncNotes tag scan, GetNotesById retrieval, the evidence reads) is
# PARKED to a later slice. This slice needs none of them — it is serde wire types, JSON fixtures,
# and config.
miden-protocol = { version = "=0.16.0-rc.3" }

[dev-dependencies]
# Exact-variant assertions + parameterized reject tables; versions from the workspace table.
rstest = { workspace = true }
assert_matches = { workspace = true }
# The signing fixture derives each attester's 20-byte Ethereum-style address the same way the library
# recovers it (`keccak256(uncompressed pubkey)[12..]`), so a fixture address and a recovered address
# are the same 20 bytes. `sha3` is a normal (library) dependency now — see [dependencies] — and is
# available to the tests through it.
# Declared now, consumed by the Circle drivers. The relayer proved the pattern this crate's
# `HttpTransport` seam is shaped for: a schema-exact mock Circle server routed by axum and driven IN
# PROCESS through tower's `ServiceExt::oneshot`, installed as the client's transport. It binds NO
# socket, because the audit/CI sandbox denies `bind(127.0.0.1:0)` (EPERM) — a loopback-server mock
# could not run in a gate that has to be green in every environment. `rand` seeds the deterministic
# attester keypairs the signing slice  signs its vectors with. None of the three has a call
# site in THIS slice, which builds no driver and makes no call; they are pinned here so the driver slice inherits
# the settled stack rather than re-litigating it (and wiremock/httpmock/mockito are absent from the
# pinned offline cache besides — declaring one would break the offline gate outright).
axum = { workspace = true }
tower = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
# Every idempotency-ledger test opens a REAL ledger on a REAL file, in a directory tempfile removes
# with the test. "Durable across a restart" is only provable against a file a second, independent
# handle can reopen — so no test here reaches for an in-memory database, which is precisely the thing
# `SubmitLedger::open` refuses.
tempfile = { workspace = true }
