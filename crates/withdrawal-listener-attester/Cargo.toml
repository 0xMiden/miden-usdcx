[package]
name = "withdrawal-listener-attester"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase-4 P4-WITHDRAWAL (CMP-C2/C3): off-chain burn-listener / attester — this slice ships the crate scaffold, the Circle withdrawal wire types, the schema-frozen mock fixtures, and the auth posture"

[dependencies]
xusdc-encoding = { path = "../xusdc-encoding" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { workspace = true }
hex = { workspace = true }
bon = { workspace = true }
k256 = { workspace = true }
sha3 = { workspace = true }
rusqlite = { workspace = true }
miden-protocol = { version = "=0.16.0-rc.6" }
miden-standards = { version = "=0.16.0-rc.6" }

[dev-dependencies]
rstest = { workspace = true }
assert_matches = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = { workspace = true }
