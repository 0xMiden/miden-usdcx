[package]
name = "xreserve-deposit-relayer-lite"
version = "0.0.0"
edition = "2021"
publish = false
description = "A minimal xUSDC deposit relayer: poll Circle, mint the attested deposits, advance the cursor."

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = { workspace = true }
