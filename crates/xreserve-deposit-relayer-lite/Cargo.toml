[package]
name = "xreserve-deposit-relayer-lite"
version = "0.0.0"
edition = "2021"
publish = false
description = "Relays Circle xReserve deposit attestations to the xUSDC faucet."

[dependencies]
xusdc-encoding = { path = "../xusdc-encoding" }
miden-protocol = { version = "=0.17.0-rc.6" }

anyhow = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2"
humantime = "2"
parse_link_header = { version = "0.4", default-features = false, features = ["url"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
