[package]
name = "xreserve-deposit-relayer-lite"
version = "0.0.0"
edition = "2021"
publish = false
description = "Relays Circle xReserve deposit attestations to the xUSDC faucet."

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
miden-protocol = { version = "=0.17.0-rc.6" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
