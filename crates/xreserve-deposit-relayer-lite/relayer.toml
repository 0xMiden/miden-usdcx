# The working example `just run-relayer-lite` uses. Placeholders throughout — replace the four
# identity values for a real deployment. The relayer validates all of this and then stops at the
# one genuinely missing piece: the Miden leg, which awaits a miden-client release for protocol
# v0.16. Unknown keys are refused, not ignored.

circle_base_url = "https://xreserve-api-testnet.circle.com"

# The remote-domain id Circle assigns Miden. PLACEHOLDER — Circle-owned, OPEN.
remote_domain = 10001

# The xUSDC faucet (a PUBLIC network account) and the relayer's own account. PLACEHOLDERS.
faucet_account_id = "0x222222222222221122222222222222"
relayer_account_id = "0x111111101111111111111111111111"

# The attester key beside every signature — a real curve point (the pinned test-fixture key), but
# NOT Circle's attester. PLACEHOLDER.
attester_pubkey_hex = "03a13f9dcab6e20fe08b99362d9be1771810cff0b4e242dee574ce696630780d3f"

# Under target/ so the example leaves nothing untracked behind. A deployment points this somewhere
# durable: losing it re-scans Circle's feed from the beginning (safe — the chain refuses the
# duplicate mints — but slow and fee-wasteful).
store_path = "target/relayer-lite-cursor"
