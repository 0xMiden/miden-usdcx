[package]
name = "xreserve-deposit-relayer"
version = "0.0.0"
edition = "2021"
publish = false
description = "Relays Circle xReserve deposit attestations to the xUSDC faucet."

[dependencies]
miden-usdcx = { workspace = true }
miden-protocol = { workspace = true }
miden-client = { workspace = true, features = ["std", "tonic"] }
miden-client-sqlite-store = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-forest = { workspace = true }
url = "2"
humantime = "2"
parse_link_header = { version = "0.4", default-features = false, features = ["url"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
