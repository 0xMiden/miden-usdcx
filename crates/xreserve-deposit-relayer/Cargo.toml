[package]
name = "xreserve-deposit-relayer"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase-4 P4-RELAYER (CMP-C1): off-chain deposit-attestation relayer — a liveness service; this slice ships the Circle-facing HTTP half (client, schema, attestation fetch, info) on top of the DepositIntent decoder + attestation envelope"

# The DepositIntent layout, byte offsets, field checks, u32-LE packing, and the 1024-felt
# NoteStorage bound are OWNED by unit-04 (`xusdc-encoding`, `xreserve::encoding`) and consumed here
# BY REFERENCE (single-owner rule). This crate never re-derives an offset or re-implements the codec
# (anti-ASG-16 — the 240-byte header is 60 u32-LE felts, never 240/8 = 30).
#
# tokio/serde are the async + serialization deps the crate wires; reqwest is the Circle transport.
#
# reqwest DEFERRAL — DISCHARGED IN THIS SLICE. Earlier slices could not declare reqwest: the repo
# gate is offline against a PINNED cache (`--locked --offline`, no crates.io — root CLAUDE.md ground
# rule 1 / G0), Cargo must RESOLVE a declared registry package even when it is optional, and reqwest
# was not in that cache, so any reqwest entry made EVERY offline command fail with "no matching
# package named `reqwest` found". The deferral record (what/why/which-slice/how) is in
# ./DEFERRED-DEPENDENCIES.md, and it named THIS — the Circle-facing HTTP client slice — as the one
# that declares reqwest, once the cache is seeded (option 1). The cache now carries reqwest 0.13.4
# and its hyper/rustls/h2 closure, so the offline gate resolves and the dependency lands here. The
# guard test (tests/deferred_dependencies_doc.rs) flipped with it: it now asserts the DISCHARGED
# state — reqwest declared with the offline-correct feature set, the record updated to say so.
# No Circle endpoint, credential, or Miden domain is committed — Q-API-AUTH / Q-DOM-1 stay OPEN
# (REQUIRES CIRCLE CONFIRMATION): the auth header is an injection point fed from config, never a
# baked-in key, and the base URL is a config value with the documented testnet host as its default.

[dependencies]
xusdc-encoding = { path = "../xusdc-encoding" }
# Shared versions live in the root [workspace.dependencies]; crate-specific feature sets are added
# on top of the workspace version.
#   tokio  — `sync` for the rate governor's shared windows, `time` for backoff sleeps.
#   reqwest — the Circle HTTP transport (CMP-D1/D3/D4). `rustls` is 0.13's TLS feature name (0.12's
#             was `rustls-tls`); `default-features = false` keeps system OpenSSL out of the graph.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Envelope binding (validate::envelope, DC-2 / INV-DEPOSIT-ATTESTATION-RAW-KECCAK):
#   hex  — decodes the Circle-facing wire strings (payload / messageHash / attestation).
#   sha3 — recomputes `keccak256(payload)` to bind the envelope's messageHash to the payload. This
#          is RAW keccak over the FULL payload: no EIP-712 `\x19\x01` domain/struct framing, no
#          personal-sign prefix, no Poseidon2. It is a LIVENESS check only.
# k256 is deliberately NOT a library dependency: the relayer never verifies the ECDSA signature
# off-chain — the attestation is verified ON-CHAIN at D5d (faucet-owned, R-MINT-13/14). It appears
# below as a DEV-dependency, for signing the test fixture only.
hex = { workspace = true }
sha3 = { workspace = true }
# The idempotency seam's persistence (`idempotency`): a single-file SQLite database holding the
# submitted-nonce log and the per-remote-domain `Link` cursor. The choice is RECORDED, with the
# alternatives weighed, in ./PERSISTENCE-CHOICE.md (guarded by tests/persistence_choice_doc.rs).
# In one line: the dedup this seam exists for is a CLAIM — check-then-insert must be one atomic step
# even with two observers running — and SQLite's `BEGIN IMMEDIATE` + a PRIMARY KEY on the nonce give
# exactly that, where a JSON/bincode file's read-modify-write cannot. Version/features come from the
# root [workspace.dependencies] (`bundled`: SQLite is compiled from the vendored amalgamation, so the
# build depends on no system libsqlite3 and cannot drift with the host's version).
rusqlite = { workspace = true }

[dev-dependencies]
# Exact-variant assertions + parameterized reject tables; versions from the workspace table.
rstest = { workspace = true }
assert_matches = { workspace = true }
# Every idempotency test opens a REAL store on a REAL file (tempfile gives it a directory that is
# deleted with the test): "durable across a restart" is only provable against a file that a second,
# independent handle can reopen — so no test ever reaches for an in-memory database. (The corruption
# tests reach past the store's own API — writing an unknown status string / a foreign `user_version`
# straight into the file — through the `rusqlite` above, which test targets link like any other
# dependency; it is not duplicated here.)
tempfile = { workspace = true }
# The schema-exact mock Circle server the contract tests run against (tests/mock_circle): an axum
# Router driven IN PROCESS through tower's `ServiceExt::oneshot`, installed as the client's
# `HttpTransport`. It binds NO socket — the audit/CI sandbox denies `bind(127.0.0.1:0)` (EPERM), so a
# loopback server cannot be part of a gate that must be green everywhere. The relayer still BUILDS a
# real `reqwest::Request` (base-url join, query serialization, auth-header injection) and the mock
# asserts on exactly that, so the rate governor, the backoff, the status policy, the `Link`-cursor
# parse and the serde decode are all exercised — only reqwest's own socket write is out of scope.
# wiremock/httpmock/mockito are absent from the pinned cache (they would break the offline gate) and
# are socket servers besides. NO Circle endpoint is ever contacted live (§11 mock disclosure: the
# Circle legs are REQUIRES CIRCLE CONFIRMATION and mock-only; the Miden leg, which must NOT be faked,
# is a later slice).
axum = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
# Partner-held attestation test vector (tests/fixtures): a DETERMINISTIC secp256k1 key SIGNS
# `keccak256(payload)` — k256 the keypair+signature, rand the seeded (reproducible) RNG. Signing
# only, in tests only; the Poseidon2 pubkey commitment comes from unit-04's `pubkey_commitment`
# (single-owner rule — this crate never re-derives it). Mirrors unit-04's own in-test D5d vectors.
k256 = { workspace = true }
rand = { workspace = true }
# The fixture's allowlist key is a Miden `Word` (Poseidon2, computed by unit-04's
# `pubkey_commitment`), and the Poseidon2 negative comparator hashes with the protocol `Hasher` —
# both need the protocol types NAMED, so miden-protocol is a TEST-only dep here (same git rev as
# the rest of the workspace, per V15-DEVNET-BASELINE). The production relayer library stays
# Miden-free until the Miden-facing (mint-note builder / submit) slice.
miden-protocol = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8" }
