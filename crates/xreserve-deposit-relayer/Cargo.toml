[package]
name = "xreserve-deposit-relayer"
version = "0.0.0"
edition = "2021"
publish = false
description = "Phase-4 P4-RELAYER (CMP-C1): off-chain deposit-attestation relayer — a liveness service; this slice ships the Circle-facing HTTP half (client, schema, attestation fetch, info) on top of the DepositIntent decoder + attestation envelope"

[dependencies]
xusdc-encoding = { path = "../xusdc-encoding" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
sha3 = { workspace = true }
rusqlite = { workspace = true }
miden-protocol = { version = "=0.16.0-rc.6" }
rand = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
assert_matches = { workspace = true }
tempfile = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
k256 = { workspace = true }
rand = { workspace = true }
miden-protocol = { version = "=0.16.0-rc.6", features = ["testing"] }
miden-standards = { version = "=0.16.0-rc.6" }
