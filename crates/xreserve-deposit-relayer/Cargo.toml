[package]
name = "xreserve-deposit-relayer"
version = "0.0.0"
edition = "2021"
publish = false
description = "Relays Circle xReserve deposit attestations to the xUSDC faucet."

[dependencies]
miden-usdcx = { workspace = true }
miden-protocol = { workspace = true }
miden-client = { workspace = true, features = ["std", "tonic"] }
miden-client-sqlite-store = { workspace = true }

anyhow = { workspace = true }
async-trait = "0.1"
clap = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
usdcx-telemetry = { path = "../usdcx-telemetry" }
url = { workspace = true }
humantime = "2"
parse_link_header = { version = "0.4", default-features = false, features = ["url"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
miden-objects = { workspace = true }
miden-protocol = { workspace = true, features = ["testing"] }
miden-usdcx = { workspace = true, features = ["testing"] }
rstest = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
