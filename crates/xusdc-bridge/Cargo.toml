[package]
name = "xusdc-bridge"
version = "0.0.0"
edition = "2021"
publish = false
description = "Runs the xUSDC deposit relayer and withdrawal attester together"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
humantime = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
xreserve-deposit-relayer = { path = "../xreserve-deposit-relayer" }
xusdc-attester = { path = "../xusdc-light-attester" }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
