[package]
name = "xusdc-encoding"
version = "0.0.0"
edition = "2021"
publish = false
description = "xUSDC-on-Miden 04 shared encoding: hand-written MASM + Rust mirror and test harness"

# Pinned per docs/governing/V15-DEVNET-BASELINE.md: protocol v0.15.3 — git rev-pinned to
# the released-tag commit 681fc90584131560b87db8f7487685f4fa8420a8 (CS-3; the repo is the
# protocol monorepo, formerly miden-base — both GitHub names resolve the same rev). The
# lock keeps the v0.15.3-locked 0.23.3 assembler family. The `testing` feature on the main
# miden-protocol dep is required by the committed vector generator (AccountIdBuilder).

[dependencies]
miden-protocol  = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8", features = ["testing"] }
miden-standards = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
miden-standards = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8", features = ["testing"] }
miden-testing   = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8" }
miden-tx        = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8" }
# exact-error matching for u32-assert traps (OperationError::U32AssertionFailed); same
# 0.23.3 the v0.15.3 lock already resolves
miden-processor = "=0.23.3"
tokio = { version = "1", features = ["macros", "rt"] }
anyhow = "1"
rstest = "0.26"
assert_matches = "1.5"
