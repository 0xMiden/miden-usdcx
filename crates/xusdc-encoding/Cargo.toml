[package]
name = "xusdc-encoding"
version = "0.0.0"
edition = "2021"
publish = false
description = "xUSDC-on-Miden 04 shared encoding: hand-written MASM + Rust mirror and test harness"

[dependencies]
miden-protocol  = { version = "=0.16.0-rc.6", features = ["testing"] }
miden-standards = { version = "=0.16.0-rc.6" }
miden-tx        = { version = "=0.16.0-rc.6" }
serde = { workspace = true }
serde_json = { workspace = true }
bon = { workspace = true }
# The vector-generator binary needs k256 as a regular dependency.
k256 = { workspace = true }

sha3 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
miden-crypto = { version = "0.29", default-features = false, features = ["std"], optional = true }

[build-dependencies]
miden-assembly             = { workspace = true, features = ["std"] }
miden-core-lib             = { workspace = true }
miden-package-registry     = { workspace = true, features = ["resolver", "std"] }
miden-protocol             = { version = "=0.16.0-rc.6" }
miden-protocol-build-utils = { workspace = true }
miden-standards            = { version = "=0.16.0-rc.6" }

[features]
# Regenerate vectors with `cargo run --locked -p xusdc-encoding --bin gen_vectors --features vectors`.
vectors = ["dep:sha3", "dep:rand", "dep:miden-crypto"]

testing = []

[[bin]]
name = "gen_vectors"
required-features = ["vectors"]

[dev-dependencies]
# Enable test-only MASM exports for the integration tests.
xusdc-encoding  = { path = ".", features = ["testing"] }
miden-standards = { version = "=0.16.0-rc.6", features = ["testing"] }
miden-testing   = { version = "=0.16.0-rc.6" }
miden-processor = "0.29"
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
anyhow = { workspace = true }
rstest = { workspace = true }
assert_matches = { workspace = true }
sha3 = { workspace = true }
rand = { workspace = true }
miden-crypto = { version = "0.29", default-features = false, features = ["std"] }
