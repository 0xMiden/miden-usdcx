[package]
name = "xusdc-encoding"
version = "0.0.0"
edition = "2021"
publish = false
description = "xUSDC-on-Miden 04 shared encoding: hand-written MASM + Rust mirror and test harness"

# Pinned per docs/MIGRATION-V16-ALPHA2.md (supersedes the V15-DEVNET-BASELINE pin for this
# branch): protocol family from crates.io at `=0.16.0-alpha.2`, which resolves the 0.25.3
# assembler/VM family and miden-crypto 0.28. The `testing` feature on the main miden-protocol
# dep is required by the committed vector generator (AccountIdBuilder).

[dependencies]
miden-protocol  = { version = "=0.16.0-alpha.4", features = ["testing"] }
miden-standards = { version = "=0.16.0-alpha.4" }
serde = { workspace = true }
serde_json = { workspace = true }
# k256 is a REGULAR dependency since the v16 migration (MIGRATION-V16-ALPHA2.md S16): the
# vm#3342 affine commitment format makes unit-04 the owner of the SEC1→affine decompression
# (the Circle ingress stays the 33-byte compressed pubkey; the on-chain staging is the 16
# affine-coordinate felts), and the decompression needs k256's curve arithmetic in the library
# itself — not just in the generator.
k256 = { workspace = true }

# Vector-generator crates: OPTIONAL, gated behind the `vectors` feature; never
# compiled for the library or the normal `cargo test`/`cargo build` path. The generator
# binary requires this feature ([[bin]] below). The set mirrors the precompile canary
# (canary/precompile-execution-grounding/Cargo.toml): k256 (above, now a regular dep) produces
# the secp256k1 keypair + signature independently of miden-crypto's signer, sha3 the keccak
# digest, and miden-crypto provides PublicKey::to_commitment — the canonical
# attester-allowlist keying primitive the ATT vectors pin (the TV-DUAL-5 oracle). `std` gates
# miden-crypto's `dsa` module.
sha3 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
miden-crypto = { version = "0.28", default-features = false, features = ["std"], optional = true }

[features]
# Enables the canonical golden-vector generator binary. Its keccak/commitment crates live
# behind this feature so they never enter the library or the normal test build (k256 is a
# regular dependency since S16); regenerate the artifact with
# `cargo run --bin gen_vectors --features vectors`.
vectors = ["dep:sha3", "dep:rand", "dep:miden-crypto"]

# The committed-artifact generator: a normal binary, so its deps are real
# [dependencies] (optional, feature-gated) — `cargo run --bin` cannot see dev-deps.
[[bin]]
name = "gen_vectors"
required-features = ["vectors"]

[dev-dependencies]
miden-standards = { version = "=0.16.0-alpha.4", features = ["testing"] }
miden-testing   = { version = "=0.16.0-alpha.2" }
miden-tx        = { version = "=0.16.0-alpha.4" }
# exact-error matching for u32-assert traps (OperationError::U32AssertionFailed); same
# 0.25.3 the alpha.2 family resolves — the pin moves in lockstep with the protocol family so
# exactly one processor copy exists and the error downcasts unify (MIGRATION-V16-ALPHA2.md R3)
miden-processor = "=0.25.3"
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
anyhow = { workspace = true }
rstest = { workspace = true }
assert_matches = { workspace = true }
# D5d attestation test vectors: deterministic secp256k1 keypairs + signatures generated
# IN-TEST (zero touch to the 04 canonical artifact), mirroring the precompile canary and the
# gen_vectors att_* helpers — k256 the keypair+signature (a regular dependency since S16),
# sha3 the keccak digest, miden-crypto the PublicKey::to_commitment allowlist key. The
# secp256k1/keccak trio has a second consumer (the relayer's envelope binding + partner-key
# fixture); the versions live in [workspace.dependencies] and stay byte-identical to the
# precompile canary's.
sha3 = { workspace = true }
rand = { workspace = true }
miden-crypto = { version = "0.28", default-features = false, features = ["std"] }
