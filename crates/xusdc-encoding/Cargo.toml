[package]
name = "xusdc-encoding"
version = "0.0.0"
edition = "2021"
publish = false
description = "xUSDC-on-Miden 04 shared encoding: hand-written MASM + Rust mirror and test harness"

# The four protocol-monorepo crates come from git at ONE frozen rev of the `next`
# branch — always the rev key, never a floating branch pin, which would make the build
# non-reproducible. The frozen graph resolves the 0.25.8 assembler/VM family (0.25.0–0.25.7 are
# yanked on crates.io) and miden-crypto 0.29. The `testing` feature on the main miden-protocol
# dep is required by the committed vector generator (AccountIdBuilder).

[dependencies]
miden-protocol  = { git = "https://github.com/0xMiden/protocol", rev = "75d05d962dc82a1d9fff077b043f5e1647d8061d", features = ["testing"] }
miden-standards = { git = "https://github.com/0xMiden/protocol", rev = "75d05d962dc82a1d9fff077b043f5e1647d8061d" }
serde = { workspace = true }
serde_json = { workspace = true }
# bon powers the note-factory builders and the dedicated note-storage types (the standards
# PswapNote / PswapNoteStorage pattern the note factories adopt).
bon = { workspace = true }
# k256 is a REGULAR dependency (not vectors-gated): the attester commitment is computed over
# the affine pubkey form, which makes this crate the owner of the SEC1→affine decompression
# (the Circle ingress stays the 33-byte compressed pubkey; the on-chain staging is the 16
# affine-coordinate felts), and the decompression needs k256's curve arithmetic in the library
# itself — not just in the generator.
k256 = { workspace = true }

# Vector-generator crates: OPTIONAL, gated behind the `vectors` feature; never
# compiled for the library or the normal `cargo test`/`cargo build` path. The generator
# binary requires this feature ([[bin]] below). k256 (above, a regular dep) produces
# the secp256k1 keypair + signature independently of miden-crypto's signer, sha3 the keccak
# digest, and miden-crypto provides PublicKey::to_commitment — the canonical
# attester-allowlist keying primitive the attestation vectors pin (the oracle the
# cross-implementation commitment test checks against). `std` gates miden-crypto's `dsa`
# module.
sha3 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
miden-crypto = { version = "0.29", default-features = false, features = ["std"], optional = true }

[features]
# Enables the canonical golden-vector generator binary. Its keccak/commitment crates live
# behind this feature so they never enter the library or the normal test build (k256 is a
# regular dependency); regenerate the artifact with
# `cargo run --bin gen_vectors --features vectors`.
vectors = ["dep:sha3", "dep:rand", "dep:miden-crypto"]

# The committed-artifact generator: a normal binary, so its deps are real
# [dependencies] (optional, feature-gated) — `cargo run --bin` cannot see dev-deps.
[[bin]]
name = "gen_vectors"
required-features = ["vectors"]

[dev-dependencies]
miden-standards = { git = "https://github.com/0xMiden/protocol", rev = "75d05d962dc82a1d9fff077b043f5e1647d8061d", features = ["testing"] }
miden-testing   = { git = "https://github.com/0xMiden/protocol", rev = "75d05d962dc82a1d9fff077b043f5e1647d8061d" }
miden-tx        = { git = "https://github.com/0xMiden/protocol", rev = "75d05d962dc82a1d9fff077b043f5e1647d8061d" }
# exact-error matching for u32-assert traps (OperationError::U32AssertionFailed); 0.29.0 is the
# version the frozen protocol graph resolves AND the only live 0.25.x on crates.io (0.25.0–0.25.7
# are yanked) — the pin moves in lockstep with the protocol family so exactly one processor copy
# exists and the error downcasts unify
miden-processor = "=0.29.0"
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
anyhow = { workspace = true }
rstest = { workspace = true }
assert_matches = { workspace = true }
# Attestation test vectors: deterministic secp256k1 keypairs + signatures generated
# IN-TEST (zero touch to the canonical committed artifact), matching the
# gen_vectors att_* helpers — k256 the keypair+signature (a regular dependency),
# sha3 the keccak digest, miden-crypto the PublicKey::to_commitment allowlist key. The
# secp256k1/keccak trio has a second consumer (the relayer's envelope binding + partner-key
# fixture); the versions live in [workspace.dependencies].
sha3 = { workspace = true }
rand = { workspace = true }
miden-crypto = { version = "0.29", default-features = false, features = ["std"] }
