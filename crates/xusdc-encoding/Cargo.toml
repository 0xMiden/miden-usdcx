[package]
name = "xusdc-encoding"
version = "0.0.0"
edition = "2021"
publish = false
description = "xUSDC-on-Miden 04 shared encoding: hand-written MASM + Rust mirror and test harness"

# Pinned per docs/governing/V15-DEVNET-BASELINE.md: protocol v0.15.3 — git rev-pinned to
# the released-tag commit 681fc90584131560b87db8f7487685f4fa8420a8 (the repo is the
# protocol monorepo, formerly miden-base — both GitHub names resolve the same rev). The
# lock keeps the v0.15.3-locked 0.23.3 assembler family. The `testing` feature on the main
# miden-protocol dep is required by the committed vector generator (AccountIdBuilder).

[dependencies]
miden-protocol  = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8", features = ["testing"] }
miden-standards = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8" }
serde = { workspace = true }
serde_json = { workspace = true }

# Vector-generator crates: OPTIONAL, gated behind the `vectors` feature; never
# compiled for the library or the normal `cargo test`/`cargo build` path. The generator
# binary requires this feature ([[bin]] below). The set mirrors the precompile canary
# (canary/precompile-execution-grounding/Cargo.toml): k256 produces the secp256k1 keypair +
# signature independently of miden-crypto's signer, sha3 the keccak digest, and miden-crypto
# provides PublicKey::to_commitment — the canonical attester-allowlist keying primitive the
# ATT vectors pin (the TV-DUAL-5 oracle). `std` gates miden-crypto's `dsa` module
# (miden-crypto-0.25.1/src/lib.rs:9).
k256 = { version = "0.13", features = ["ecdsa"], optional = true }
sha3 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
miden-crypto = { version = "0.25", default-features = false, features = ["std"], optional = true }

[features]
# Enables the canonical golden-vector generator binary. Its secp256k1/keccak/commitment
# crates live behind this feature so they never enter the library or the normal test build;
# regenerate the artifact with `cargo run --bin gen_vectors --features vectors`.
vectors = ["dep:k256", "dep:sha3", "dep:rand", "dep:miden-crypto"]

# The committed-artifact generator: a normal binary, so its deps are real
# [dependencies] (optional, feature-gated) — `cargo run --bin` cannot see dev-deps.
[[bin]]
name = "gen_vectors"
required-features = ["vectors"]

[dev-dependencies]
miden-standards = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8", features = ["testing"] }
miden-testing   = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8" }
miden-tx        = { git = "https://github.com/0xMiden/protocol", rev = "681fc90584131560b87db8f7487685f4fa8420a8" }
# exact-error matching for u32-assert traps (OperationError::U32AssertionFailed); same
# 0.23.3 the v0.15.3 lock already resolves
miden-processor = "=0.23.3"
tokio = { workspace = true, features = ["macros", "rt"] }
anyhow = { workspace = true }
rstest = { workspace = true }
assert_matches = { workspace = true }
# D5d attestation test vectors: deterministic secp256k1 keypairs + signatures generated
# IN-TEST (zero touch to the 04 canonical artifact), mirroring the precompile canary and the
# gen_vectors att_* helpers — k256 the keypair+signature, sha3 the keccak digest, miden-crypto
# the PublicKey::to_commitment allowlist key. Same versions as the `vectors` feature deps and the
# canary (single workspace member, so kept crate-local; promote to [workspace.dependencies] if a
# second crate adopts them).
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
rand = "0.8"
miden-crypto = { version = "0.25", default-features = false, features = ["std"] }
