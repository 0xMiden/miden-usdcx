[package]
name = "xusdc-genesis"
version = "0.0.0"
edition = "2021"
publish = false
description = "xUSDC-on-Miden genesis tool: builds the genesis xUSDC faucet offline and emits the node's genesis inputs for it"

[dependencies]
miden-protocol = { version = "=0.16.1" }
xusdc-encoding = { path = "../xusdc-encoding" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
miden-protocol = { version = "=0.16.1", features = ["testing"] }
miden-standards = { version = "=0.16.1" }
rstest = { workspace = true }
assert_matches = { workspace = true }
tempfile = { workspace = true }
