[package]
name = "xusdc-attester"
version = "0.0.0"
edition = "2021"
publish = false
description = "Off-chain xUSDC withdrawal attester"

[dependencies]
anyhow = { workspace = true }
aws-config = { workspace = true }
aws-sdk-kms = { workspace = true }
alloy-primitives = { workspace = true, features = ["k256"] }
alloy-sol-types = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
humantime = "2"
k256 = { workspace = true, features = ["pkcs8"] }
miden-usdcx = { workspace = true }
miden-client = { workspace = true, features = ["std", "tonic"] }
miden-protocol = { workspace = true }
miden-standards = { workspace = true }
miden-objects = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
http = "1"
miden-protocol = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["time", "test-util"] }
