[package]
name = "xusdc-attester"
version = "0.0.0"
edition = "2021"
publish = false
description = "Off-chain xUSDC withdrawal attester"

[dependencies]
anyhow = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
hex = { workspace = true }
miden-usdcx = { workspace = true }
miden-client = { workspace = true, features = ["std", "tonic"] }
miden-protocol = { workspace = true }
miden-standards = { workspace = true }
miden-objects = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
toml = "1"

[dev-dependencies]
http = "1"
miden-protocol = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["time", "test-util"] }
