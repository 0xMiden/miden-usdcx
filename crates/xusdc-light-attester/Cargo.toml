[package]
name = "xusdc-attester"
version = "0.0.0"
edition = "2021"
publish = false
description = "Off-chain xUSDC withdrawal attester"

[dependencies]
anyhow = { workspace = true }
alloy-primitives = { workspace = true, features = ["k256"] }
alloy-sol-types = { workspace = true }
xusdc-encoding = { path = "../xusdc-encoding" }
clap = { workspace = true }
hex = { workspace = true }
humantime = "2"
k256 = { workspace = true }
miden-client = { version = "=0.17.0-rc.1", features = ["tonic"] }
miden-protocol = { version = "=0.17.0-rc.5" }
miden-standards = { version = "=0.17.0-rc.5" }
miden-objects = { version = "=0.17.0-rc.5" }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http = "1"
miden-protocol = { version = "=0.17.0-rc.5", features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["time", "test-util"] }
