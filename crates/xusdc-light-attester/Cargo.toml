[package]
name = "xusdc-attester"
version = "0.0.0"
edition = "2021"
publish = false
description = "Off-chain xUSDC withdrawal attester"

[dependencies]
anyhow = { workspace = true }
alloy-primitives = { workspace = true, features = ["k256"] }
alloy-sol-types = { workspace = true }
xusdc-encoding = { path = "../xusdc-encoding" }
clap = { workspace = true }
hex = { workspace = true }
humantime = "2"
k256 = { workspace = true }
miden-client = { version = "=0.16.1", features = ["tonic"] }
miden-protocol = { version = "=0.16.1" }
miden-standards = { version = "=0.16.1" }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tokio = { workspace = true, features = ["macros", "rt", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
miden-protocol = { version = "=0.16.1", features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "test-util"] }
