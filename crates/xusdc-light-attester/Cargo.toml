[package]
name = "xusdc-attester"
version = "0.0.0"
edition = "2021"
publish = false
description = "Off-chain xUSDC withdrawal attester"

[dependencies]
miden-usdcx = { workspace = true }
miden-client = { workspace = true, features = ["std", "tonic"] }
miden-protocol = { workspace = true }
miden-standards = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
thiserror = "2"
tokio = { workspace = true, features = ["macros", "rt"] }
toml = "1"

[dev-dependencies]
hex = { workspace = true }
tempfile = { workspace = true }
