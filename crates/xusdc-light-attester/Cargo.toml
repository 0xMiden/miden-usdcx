[package]
name = "xusdc-attester"
version = "0.0.0"
edition = "2021"
publish = false
description = "Off-chain xUSDC withdrawal attester"

[dependencies]
xusdc-encoding = { path = "../xusdc-encoding" }
miden-client = { version = "=0.16.1", features = ["tonic"] }
miden-protocol = { version = "=0.16.1" }
miden-standards = { version = "=0.16.1" }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
thiserror = "2"
tokio = { workspace = true, features = ["macros", "rt"] }
toml = "1"

[dev-dependencies]
hex = { workspace = true }
miden-protocol = { version = "=0.16.0-rc.6", features = ["testing"] }
tempfile = { workspace = true }
