# Development-only configuration. The faucet ID is intentionally not deployed.
miden_rpc_url = "https://rpc.devnet.miden.io"
circle_request_timeout_ms = 10000
faucet_account_id_hex = "0xbb405fd9fe431bd1135a292de098cb"
circle_api_base_url = "https://xreserve-api-testnet.circle.com"
use_circle_forwarding = false
# Maximum fee per withdrawal, in smallest USDC units. Zero permits only fee-free withdrawals.
max_withdrawal_fee = 0
# Rolling withdrawal limit in smallest USDC units; zero pauses new submissions.
# Development 10m USDC placeholder: replace with Circle's confirmed chain limit.
withdrawal_limit = 10_000_000_000_000
withdrawal_window_hours = 24
# Set this only to the fixed start of Circle's HTTP 400 withdrawal-limit message, the text before
# the numbers, for example "Withdrawal request exceeds rolling withdrawal limit", to enable
# automatic retries.
# withdrawal_cap_error_message = ""
poll_interval_ms = 1000
faucet_deployment_block = 0

# Placeholder only: replace both values with one checkpoint verified out of band.
trusted_anchor_block = 0
trusted_anchor_commitment_hex = "0x0100000000000000020000000000000003000000000000000400000000000000"
minimum_finality_depth_blocks = 1

# Public development values. Startup compares these with the two loaded local keys.
# AWS KMS loading remains deferred.
expected_signing_public_keys_hex = [
  "0x0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798",
  "0x02c6047f9441ed7d6d3045406e95c07cd85c778e4b8cef3ca7abac09b95c709ee5",
]

# This SQLite file is durable ledger state and must live on persistent storage.
# Only one attester instance may open it at a time.
store_path = "../../target/xusdc-light-attester.sqlite3"
