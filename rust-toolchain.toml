# To adopt a newer toolchain: bump `channel`, run `just ci`, fix what the new lints find, commit it
# all together.
#
# The channel names a patch release because a bare "1.98" resolves to 1.98.0, which carries a
# miscompilation bug. 1.98.1 is also the release miden-protocol pins.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
